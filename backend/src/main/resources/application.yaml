spring:
  application:
    name: github-ci-intelligence
  profiles:
    default: local

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    table-name: ${DYNAMODB_TABLE_NAME:workflow-analyses}
    processing-lease: ${DYNAMODB_PROCESSING_LEASE:PT5M}

github:
  token: ${GITHUB_TOKEN:}
  api-url: https://api.github.com
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}