name: github-ci-intelligence

services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:-}
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-workflow-analyses}
      S3_ENDPOINT: http://localstack:4566
      S3_LOG_BUCKET: ${S3_LOG_BUCKET:-github-ci-logs}
      S3_PATH_STYLE_ACCESS: "true"
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_URL: http://localstack:4566/queue/${AWS_REGION:-us-east-1}/000000000000/workflow-events
      SQS_WORKER_ENABLED: "true"
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
      s3-init:
        condition: service_completed_successfully
      sqs-init:
        condition: service_completed_successfully
    networks:
      - app
    stop_grace_period: 30s

  dynamodb-local:
    image: amazon/dynamodb-local:3.1.0
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    user: "0:0"
    ports:
      - "127.0.0.1:${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb-data:/home/dynamodblocal/data
    networks:
      - app

  dynamodb-init:
    image: amazon/aws-cli:2.27.41
    entrypoint: ["/bin/sh", "/init/create-tables.sh"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_PAGER: ""
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      DYNAMODB_TABLE_NAME: ${DYNAMODB_TABLE_NAME:-workflow-analyses}
    volumes:
      - ./docker/dynamodb:/init:ro
    depends_on:
      dynamodb-local:
        condition: service_started
    networks:
      - app

  localstack:
    image: localstack/localstack:4.4.0
    environment:
      SERVICES: s3,sqs
      SQS_ENDPOINT_STRATEGY: path
      PERSISTENCE: "1"
    ports:
      - "127.0.0.1:${S3_PORT:-4566}:4566"
    volumes:
      - s3-data:/var/lib/localstack
    networks:
      - app

  s3-init:
    image: amazon/aws-cli:2.27.41
    entrypoint: ["/bin/sh", "/init/create-bucket.sh"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_PAGER: ""
      S3_ENDPOINT: http://localstack:4566
      S3_LOG_BUCKET: ${S3_LOG_BUCKET:-github-ci-logs}
    volumes:
      - ./docker/s3:/init:ro
    depends_on:
      localstack:
        condition: service_started
    networks:
      - app

  sqs-init:
    image: amazon/aws-cli:2.27.41
    entrypoint: ["/bin/sh", "/init/create-queues.sh"]
    environment:
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      AWS_PAGER: ""
      SQS_ENDPOINT: http://localstack:4566
    volumes:
      - ./docker/sqs:/init:ro
    depends_on:
      localstack:
        condition: service_started
    networks:
      - app

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

networks:
  app:
    driver: bridge

volumes:
  dynamodb-data:
  s3-data:
