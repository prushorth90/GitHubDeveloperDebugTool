spring:
  application:
    name: github-ci-intelligence
  profiles:
    default: local

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  mcp:
    enabled: ${MCP_ENABLED:false}
  bedrock:
    enabled: ${BEDROCK_ENABLED:false}
    region: ${BEDROCK_REGION:${AWS_REGION:us-east-1}}
    model-id: ${BEDROCK_MODEL_ID:}
    profile: ${BEDROCK_AWS_PROFILE:}
    include-commit-changes: ${BEDROCK_INCLUDE_COMMIT_CHANGES:false}
  sqs:
    endpoint: ${SQS_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    queue-url: ${SQS_QUEUE_URL:}
    worker-enabled: ${SQS_WORKER_ENABLED:false}
    visibility-seconds: ${SQS_VISIBILITY_SECONDS:120}
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    bucket-name: ${S3_LOG_BUCKET:github-ci-logs}
    path-style-access: ${S3_PATH_STYLE_ACCESS:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  dynamodb:
    endpoint: ${DYNAMODB_ENDPOINT:}
    region: ${AWS_REGION:us-east-1}
    table-name: ${DYNAMODB_TABLE_NAME:workflow-analyses}
    processing-lease: ${DYNAMODB_PROCESSING_LEASE:PT5M}

github:
  token: ${GITHUB_TOKEN:}
  api-url: https://api.github.com
  webhook-secret: ${GITHUB_WEBHOOK_SECRET:}