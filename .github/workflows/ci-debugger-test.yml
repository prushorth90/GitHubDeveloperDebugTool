name: CI Debugger Test

on:
  workflow_dispatch:

permissions: {}

jobs:
  intentional-failure:
    name: Spring Boot integration test (simulated failure)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Simulate PostgreSQL error output and deliberately exit 1
        shell: bash
        run: |
          echo "Error: Could not connect to PostgreSQL"
          exit 1
