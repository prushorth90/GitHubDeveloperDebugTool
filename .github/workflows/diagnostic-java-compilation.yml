name: Diagnostic Test - Java Compilation

on:
  workflow_dispatch:

permissions: {}

jobs:
  java-compilation:
    name: Real javac failure from an undefined Java symbol
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DIAGNOSTIC_DIR: ${{ runner.temp }}/diagnostic-java-compilation
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Prepare isolated invalid Java source
        shell: bash
        run: |
          mkdir -p "$DIAGNOSTIC_DIR"
          cat > "$DIAGNOSTIC_DIR/DiagnosticCompilation.java" <<'JAVA'
          public class DiagnosticCompilation {
              public static void main(String[] args) {
                  int result = missingValue;
              }
          }
          JAVA
      - name: Compile invalid source with javac
        shell: bash
        run: javac -J-Duser.language=en -J-Duser.country=US "$DIAGNOSTIC_DIR/DiagnosticCompilation.java"
