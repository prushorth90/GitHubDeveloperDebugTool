spring:
  application:
    name: github-ci-intelligence
  profiles:
    default: local

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

github:
  token: ${GITHUB_TOKEN:}
  api-url: https://api.github.com